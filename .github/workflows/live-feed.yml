# Refreshes assets/live-feed.json from public deal-site feeds every 15 minutes
# while the tracker is in season (October through January 1).
name: Live deal feed

on:
  schedule:
    - cron: "*/15 * * 10,11,12 *"
    - cron: "*/15 * 1 1 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-feed
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_feeds.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/live-feed.json; then echo "No change"; exit 0; fi
          git config user.name "turkey-to-toast bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/live-feed.json
          git commit -m "Update live deal feed"
          git push
